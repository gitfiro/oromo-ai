[project]
name = "oromo-ai"
version = "0.1.0"
description = "Open AI research infrastructure for Afaan Oromoo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "duckdb>=1.5.5",
    "ftfy>=6.3.1",
    "orjson>=3.12.0",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "protobuf>=7.36.2",
    "pyarrow>=25.0.1",
    "regex>=2026.9.10",
    "sentencepiece>=0.2.2",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "trl>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
